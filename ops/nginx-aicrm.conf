# AICRM nginx 설정 — /etc/nginx/sites-available/aicrm 에 두고 sites-enabled로 심볼릭 링크.
#
# 프런트는 정적 빌드(dist)를 직접 서빙하고, /api 만 백엔드(3000)로 넘긴다.
# 프런트 axios가 baseURL='/api/v1'을 쓰므로 같은 오리진이면 CORS가 필요 없다.

server {
    listen 80;
    server_name aicrm.local;   # 매장 내부 도메인 또는 서버 IP로 교체

    # 채촌 사진·작업지시서 업로드가 통과해야 한다 (기본 1M로는 막힌다)
    client_max_body_size 25m;

    # --- 프런트 (SPA) -------------------------------------------------------
    root /var/www/aicrm;
    index index.html;

    location / {
        # 새로고침·딥링크(/customers/123)는 서버에 파일이 없으므로 index.html로 넘긴다
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 번들은 영구 캐시, index.html은 캐시 금지(배포 즉시 반영)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- 백엔드 -------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 작업지시서·계약서 엑셀 생성이 길어질 수 있다
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
